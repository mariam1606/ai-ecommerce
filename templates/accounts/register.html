{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h1>Create Account</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn">
        Register
    </button>

</form>

<br>

<p>
    Already have an account?
    <a href="{% url 'login' %}">
        Login
    </a>
</p>

{% endblock %}
